name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 20.19.0 is the floor package.json promises, not just "some Node 20".
        node: ["20.19.0", 22, 24]
        include:
          # Path and line-ending handling differ on Windows (see src/node/pdf.ts).
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm pack --dry-run

  action:
    # The GitHub Action as a workflow uses it: the composite step, the published engine it pins.
    name: GitHub Action on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: check
        uses: ./action
        with:
          resume: action/test/resume.md
          job: action/test/job.txt
          min-score: "1"
      - shell: bash
        env:
          SCORE: ${{ steps.check.outputs.score }}
          REPORT: ${{ steps.check.outputs.report }}
        run: test "$SCORE" -ge 1 && test -f "$REPORT"

  package:
    name: Bundle size, exports, browser and edge smoke, benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run size
      - run: npm run smoke
      # The package.json and the published types, as consumers resolve them. ESM only by design.
      - run: npx --yes publint@0.3.25
      - run: npx --yes @arethetypeswrong/cli@0.18.5 --pack --profile esm-only
      - run: npm run bench
