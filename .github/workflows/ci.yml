name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 22.12.0 is the floor package.json promises, not just "some Node 22".
        node: ["22.12.0", 24, 26]
        include:
          # Path and line-ending handling differ on Windows (see src/node/pdf.ts).
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm pack --dry-run

  action:
    # The GitHub Action as a workflow uses it, the composite step on each OS, against the engine
    # built from this commit: the version it pins is published only when this commit is released.
    # The last step is the exception: it runs the latest published engine through npx.
    name: GitHub Action on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: check
        uses: ./action
        env:
          ATS_ENGINE_CLI: ${{ github.workspace }}/dist/cli/index.js
        with:
          resume: action/test/resume.md
          job: action/test/job.txt
          min-score: "1"
      - shell: bash
        env:
          SCORE: ${{ steps.check.outputs.score }}
          REPORT: ${{ steps.check.outputs.report }}
        run: test "$SCORE" -ge 1 && test -f "$REPORT"
      # The path a user's workflow takes: npx, the latest published engine, and the PDF reader it
      # must install itself. The version is looked up, not read from action.yml, because a release
      # pull request raises that pin before the version is on npm. No ATS_ENGINE_CLI, so a
      # missing peer fails here. The PDF is the test resume, written by tests/fixtures/buildPdf.ts.
      - name: PDF resume through npx
        shell: bash
        env:
          PDF: ${{ runner.temp }}/resume.pdf
        run: |
          node --import tsx --input-type=module -e '
          import { readFileSync, writeFileSync } from "node:fs";
          import { buildPdf, text } from "./tests/fixtures/buildPdf.ts";
          const lines = readFileSync("action/test/resume.md", "utf8").match(/[^\n]+/g);
          const ops = lines.map((line, i) => text(40, 770 - 22 * i, line.replace(/[#*]/g, "")));
          writeFileSync(process.env.PDF, buildPdf(ops.join("\n")));
          '
          version=$(npm view @veriworkly/ats-engine version)
          ATS_RESUME="$PDF" ATS_VERSION="$version" node action/run.mjs

  package:
    name: Bundle size, exports, browser and edge smoke, benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run size
      - run: npm run smoke
      # The package.json and the published types, as consumers resolve them. ESM only by design.
      - run: npx --yes publint@0.3.25
      - run: npx --yes @arethetypeswrong/cli@0.18.5 --pack --profile esm-only
      - run: npm run bench
