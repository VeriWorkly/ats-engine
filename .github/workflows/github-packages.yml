name: GitHub Packages

# Publishes a released version to GitHub's npm registry as well, so it is listed under the
# repository's Packages. npmjs.com stays the primary registry. Started by the Release workflow
# after each npm release, or by hand with the tag of an existing release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. @veriworkly/ats-engine@0.2.0 (v0.1.x before the workspace)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@veriworkly"
      - run: npm ci
      - run: npm run build
      # Provenance attestations are an npmjs.com feature; GitHub's registry refuses them.
      - run: npm pkg delete publishConfig.provenance
      - run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
