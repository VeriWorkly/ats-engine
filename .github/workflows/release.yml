name: Release

# On main: opens (or updates) a "Version Packages" pull request from the pending changesets.
# Merging that pull request publishes to npm with provenance. Nothing publishes without it.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance
  actions: write # starts the GitHub Packages workflow

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # v2 reads the output of @changesets/cli v3; v1 published but could not see it, so it
      # created no git tag and no GitHub release.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        id: changesets
        with:
          version-script: npm run version-packages
          publish-script: npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      # The same engine version on GitHub's registry, so it is listed under the repository's
      # Packages. With two packages in the workspace, changesets tags each release as
      # "<name>@<version>", and a release may publish the MCP server alone.
      - if: steps.changesets.outputs.published == 'true'
        run: |
          version=$(jq -r '.[] | select(.name == "@veriworkly/ats-engine") | .version' <<< "$PUBLISHED")
          if [ -n "$version" ]; then
            gh workflow run github-packages.yml -f tag="@veriworkly/ats-engine@$version"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.changesets.outputs['published-packages'] }}
      # A new MCP server version is listed in the official MCP Registry once npm has it: the
      # registry checks the npm package's mcpName. GitHub OIDC (id-token above) grants
      # io.github.VeriWorkly/*, so no secret is needed. The publisher is pinned by version and hash.
      # npm can take minutes to serve a version it has just published, so the listing is tried
      # again, after a longer wait each time, before the step fails.
      - if: steps.changesets.outputs.published == 'true'
        working-directory: packages/mcp
        run: |
          version=$(jq -r '.[] | select(.name == "@veriworkly/ats-engine-mcp") | .version' <<< "$PUBLISHED")
          if [ -z "$version" ]; then exit 0; fi
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          for wait in 30 60 120 240 0; do
            ./mcp-publisher login github-oidc && ./mcp-publisher publish && exit 0
            [ "$wait" -eq 0 ] || sleep "$wait"
          done
          exit 1
        env:
          PUBLISHED: ${{ steps.changesets.outputs['published-packages'] }}
