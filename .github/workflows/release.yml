name: Release

# On main: opens (or updates) a "Version Packages" pull request from the pending changesets.
# Merging that pull request publishes to npm with provenance. Nothing publishes without it.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance
  actions: write # starts the GitHub Packages workflow

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # v2 reads the output of @changesets/cli v3; v1 published but could not see it, so it
      # created no git tag and no GitHub release.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        id: changesets
        with:
          version-script: npm run version-packages
          publish-script: npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      # The same version on GitHub's registry, so it is listed under the repository's Packages.
      - if: steps.changesets.outputs.published == 'true'
        run: gh workflow run github-packages.yml -f tag=v${{ fromJSON(steps.changesets.outputs['published-packages'])[0].version }}
        env:
          GH_TOKEN: ${{ github.token }}
