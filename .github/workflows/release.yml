name: Release

# On main: opens (or updates) a "Version Packages" pull request from the pending changesets.
# Merging that pull request publishes to npm with provenance. Nothing publishes without it.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # v2 reads the output of @changesets/cli v3; v1 published but could not see it, so it
      # created no git tag and no GitHub release.
      - uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
